name: islami
description: "A new Flutter project."

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.8.0
  flutter_svg: ^2.1.6
  intl: ^0.20.2
  flutter_bloc: ^9.1.1
  go_router: ^17.3.0
  equatable: ^2.1.0
  dio: ^5.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.1

  flutter_lints: ^6.0.0

flutter:
  generate: true

  uses-material-design: true

  assets:
    - assets/images/
    - assets/svgs/
    - assets/icons/

  # example:
  fonts:
    - family: JannaLT
      fonts:
        - asset: assets/fonts/JannaLT-Regular.ttf
        - asset: assets/fonts/JannaLT-Bold.ttf
          weight: 700

    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
